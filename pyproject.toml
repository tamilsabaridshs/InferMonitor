[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infermonitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
infermonitor = "infermonitor.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infermonitor", "infermonitor.*"]
exclude = ["config", "config.*", "tests", "tests.*", "docs", "docs.*"]

[tool.setuptools.package-data]
infermonitor = ["web/*"]

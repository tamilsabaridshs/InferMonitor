<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InferMonitor</title><style>
:root{color-scheme:dark;background:#0b1020;color:#eaf0ff;font:14px system-ui}body{margin:0}header{padding:22px 4vw;border-bottom:1px solid #26334d;display:flex;justify-content:space-between}main{max-width:1500px;margin:auto;padding:22px 4vw}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#141c30;border:1px solid #26334d;border-radius:12px;padding:16px;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:#91a0b9}.good{color:#55d6a2}.warn{color:#ffc66d}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#0e1628;border-radius:8px;padding:10px}.value{font-size:19px;font-weight:650}.label{font-size:12px;color:#91a0b9}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#aab8d0;font-size:11px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #26334d;font-size:12px}</style></head><body>
<header><div><h1>InferMonitor</h1><div class="muted">Ubuntu · PolyStrata · llama.cpp · AMD ROCm</div></div><div id="updated" class="muted">Connecting…</div></header><main>
<section class="card"><h2>Shared host telemetry</h2><div id="host" class="grid"></div><h2 style="margin-top:14px">GPU devices</h2><div id="gpu" class="grid"></div></section>
<h2>Inference endpoints</h2><section id="eps" class="grid"></section><section class="card"><h2>Plugin status</h2><div id="plugins" class="muted">—</div></section><section class="card"><h2>Recent history</h2><div id="history"></div></section></main>
<script>
const n=(v,u)=>v==null?'N/A':(typeof v==='number'?new Intl.NumberFormat(undefined,{maximumFractionDigits:1}).format(v):v)+(u?' '+u:'');
function panel(title,items){return '<article class="card"><h2>'+title+'</h2><div class="metrics">'+items.map(x=>'<div class="metric"><div class="value">'+n(x[1],x[2])+'</div><div class="label">'+x[0]+'</div></div>').join('')+'</div></article>'}
function render(s){document.getElementById('updated').textContent='Updated '+new Date(s.observed_at).toLocaleTimeString();let hm=s.host.metrics||[],v=k=>hm.find(x=>x.name===k)?.value;let disks=hm.filter(x=>x.name.startsWith('disk.')&&x.name.endsWith('_per_sec'));document.getElementById('host').innerHTML=panel('CPU / RAM',[['CPU',v('cpu.utilization'),'%'],['RAM used',v('memory.used')/1073741824,'GiB'],['RAM available',v('memory.available')/1073741824,'GiB'],['RAM total',v('memory.total')/1073741824,'GiB'],...disks.slice(-4).map(x=>[x.name.replace('disk.',''),x.value,'B/s'])]);document.getElementById('gpu').innerHTML=(s.gpu_devices||[]).map(d=>panel('AMD · '+d.device_id,(()=>{let mapped=(d.metrics||[]).filter(m=>!m.name.startsWith('amd_smi.'));return (mapped.length?mapped:(d.metrics||[])).map(m=>[m.name,m.name.startsWith('gpu.memory.')?m.value/1073741824:m.value,m.name.startsWith('gpu.memory.')?'GiB':m.unit])})())).join('')||'<div class="muted">AMD GPU telemetry unavailable · '+(s.gpu_provider?.error||'No device data')+'</div>';
document.getElementById('eps').innerHTML=(s.endpoints||[]).map(e=>{let m=e.metrics||[];let pick=k=>m.filter(x=>x.name.toLowerCase().includes(k)).slice(-1)[0]?.value;return '<article class="card"><h2>'+e.endpoint_id+' · <span class="'+(e.state==='connected'?'good':'warn')+'">'+e.state+'</span></h2><div class="muted">'+e.url+'</div><p><b>'+(e.engine||'Unknown engine')+'</b> · PID '+(e.process?.pid??'N/A')+'</p><div class="metrics">'+[['Decode tok/s (raw)',pick('decode_tok_s')??pick('predicted_tokens_seconds')],['Prompt tok/s (raw)',pick('prompt_tokens_seconds')],['Context',pick('max_context')],['Expert cache MiB',pick('expert_cache_mib')]].map(x=>'<div class="metric"><div class="value">'+n(x[1])+'</div><div class="label">'+x[0]+'</div></div>').join('')+'</div><p class="muted">Session '+(e.session_id||'—')+'</p><details><summary>Metrics & detection evidence</summary><pre>'+JSON.stringify({metrics:m,detection:e.detection,diagnostics:e.diagnostics,error:e.error},null,2)+'</pre></details></article>'}).join('')||'<div class="muted">No endpoints enabled</div>';document.getElementById('plugins').textContent=(s.plugins||[]).map(p=>p.plugin_id+' '+p.state+(p.error?' '+p.error:'')).join(' · ')}
async function tick(){try{let s=await (await fetch('/api/snapshot',{cache:'no-store'})).json();if(s.cycle_id)render(s);let h=await (await fetch('/api/history?limit=10')).json();document.getElementById('history').innerHTML='<table><tr><th>Time</th><th>Cycle</th><th>Detected</th></tr>'+(h.items||[]).slice().reverse().map(x=>'<tr><td>'+new Date(x.observed_at).toLocaleTimeString()+'</td><td>'+x.cycle_id.slice(0,8)+'</td><td>'+x.endpoints.map(e=>e.engine||e.state).join(', ')+'</td></tr>').join('')+'</table>'}catch(e){document.getElementById('updated').textContent='API unavailable'}}
tick();setInterval(tick,1500)
</script></body></html>
